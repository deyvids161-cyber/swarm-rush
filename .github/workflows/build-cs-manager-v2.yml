name: Build CS Manager Phase 1.1
on:
  push:
    paths:
      - '.github/workflows/build-cs-manager-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate optimized build
        shell: bash
        run: |
          mkdir -p cs-manager-fase1-v2
          printf '%s' '' | base64 -d | gzip -d > cs-manager-fase1-v2/upgrade.js
          cat > cs-manager-fase1-v2/index.html <<'EOF'
          <!doctype html>
          <html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050910"><title>CS Manager Fase 1.1</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050910;color:#eef5ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:grid;place-items:center;padding:24px}.load{width:min(520px,100%);padding:28px;border:1px solid #29415f;border-radius:22px;background:linear-gradient(180deg,#101b2a,#08111c);text-align:center}.logo{width:70px;height:70px;border-radius:20px;margin:0 auto 16px;display:grid;place-items:center;background:linear-gradient(135deg,#54e8ff,#5ff0a0);color:#04131a;font-size:25px;font-weight:1000}.bar{height:7px;border-radius:99px;background:#091421;overflow:hidden;margin-top:18px}.bar i{display:block;height:100%;width:45%;background:linear-gradient(90deg,#54e8ff,#5ff0a0);animation:m 1s ease-in-out infinite alternate}@keyframes m{to{transform:translateX(120%)}}p{color:#91a4bc;line-height:1.5}</style></head><body><div class="load" id="load"><div class="logo">CM</div><h1>CS Manager 1.1</h1><p>Carregando o motor tático otimizado para iPhone…</p><div class="bar"><i></i></div></div><script>(async()=>{try{const stamp=Date.now(),base='https://raw.githubusercontent.com/deyvids161-cyber/swarm-rush/main/';const [html,patch]=await Promise.all([fetch(base+'cs-manager-fase1/index.html?v='+stamp).then(r=>{if(!r.ok)throw Error('base '+r.status);return r.text()}),fetch(base+'cs-manager-fase1-v2/upgrade.js?v='+stamp).then(r=>{if(!r.ok)throw Error('upgrade '+r.status);return r.text()})]);const safe=patch.replace(/<\/script/gi,'<\\/script');document.open();document.write(html.replace('</body>','<script>'+safe+'<\/script></body>'));document.close()}catch(e){document.getElementById('load').innerHTML='<div class="logo">!</div><h1>Falha ao carregar</h1><p>'+e.message+'</p><button onclick="location.reload()" style="padding:13px 18px;border:0;border-radius:12px;background:#54e8ff;font-weight:900">TENTAR NOVAMENTE</button>'}})();</script></body></html>
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cs-manager-fase1-v2
          git commit -m 'Publish optimized CS Manager phase 1.1' || exit 0
          git push
