name: MekaJarvis Publish Runner

on:
  push:
    branches: [mekajarvis-fix-v011-build]

permissions:
  contents: write

jobs:
  build-and-publish:
    if: "!contains(github.event.head_commit.message, '[skip mekajarvis build]')"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: mekajarvis-fix-v011-build
          persist-credentials: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Execute validated build steps
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, textwrap

          workflow = Path('.github/workflows/mekajarvis-temp-build.yml').read_text(encoding='utf-8')
          blocks = re.split(r'(?m)^      - name: ', workflow)[1:]
          executed = 0
          for block in blocks:
              name = block.splitlines()[0].strip()
              block_run = re.search(r'(?ms)^        run: \|\n(.*)\Z', block)
              inline_run = re.search(r'(?m)^        run:\s*(.+)$', block)
              if block_run:
                  script = textwrap.dedent(block_run.group(1))
              elif inline_run:
                  script = inline_run.group(1).strip()
              else:
                  continue
              cwd_match = re.search(r'(?m)^        working-directory: (.+)$', block)
              cwd = cwd_match.group(1).strip() if cwd_match else '.'
              print(f'::group::{name}')
              subprocess.run(['bash', '-euo', 'pipefail', '-c', script], cwd=cwd, check=True)
              print('::endgroup::')
              executed += 1
          if executed < 5:
              raise SystemExit(f'Expected at least 5 build scripts, executed {executed}')
          PY

      - name: Commit compiled jar to temporary branch
        shell: bash
        run: |
          mkdir -p mekajarvis-output
          cp MekaJarvis-Forge-1.20.1/build/libs/MekaJarvis-Forge-1.20.1-0.1.1.jar mekajarvis-output/
          cp MekaJarvis-Forge-1.20.1/build/libs/MekaJarvis-Forge-1.20.1-0.1.1.jar.sha256 mekajarvis-output/
          git config user.name 'MekaJarvis Build Bot'
          git config user.email 'actions@github.com'
          git add mekajarvis-output/
          git commit -m 'Publish MekaJarvis 0.1.1 build [skip mekajarvis build]'
          git push origin HEAD:mekajarvis-fix-v011-build
